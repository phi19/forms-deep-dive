<fieldset [formArray]="form.controls.discovery">
  <legend>How did you find us?</legend>
  <div class="control">
    <input type="checkbox" id="google" name="acquisition" value="google" formControlName="0" />
    <label for="google">Google</label>
  </div>

  <div class="control">
    <input type="checkbox" id="friend" name="acquisition" value="friend" formControlName="1" />
    <label for="friend">Referred by friend</label>
  </div>

  <div class="control">
    <input type="checkbox" id="other" name="acquisition" value="other" formControlName="2" />
    <label for="other">Other</label>
  </div>

  @if (hasDiscoveryManyOptionsSelected) {
    <p class="control-error">You must select only one option.</p>
  } @else if (hasDiscoveryOnlyOneOptionSelected) {
    <p class="control-error">You must select one option.</p>
  } @else if (isDiscoveryInvalid) {
    <p class="control-error">The discovery field is invalid.</p>
  }
</fieldset>
